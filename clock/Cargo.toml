[package]
name = "clock"
version = "0.1.0"
edition = "2021"

[dependencies]
clocklib = { path = "../clocklib" }
is31fl3731-driver = { path = "../is31fl3731-driver" }
pcf8563 = "0.1.2"

embassy-embedded-hal = { version = "0.2.0", features = ["defmt"] }
embassy-sync = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.6.2", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.2.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-futures = { version = "0.1.1" }

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = { version = "2.1.0"}
portable-atomic = { version = "1.5", features = ["critical-section"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"

#fixed = "1.23.1"
#fixed-macro = "1.2"

#futures = { version = "0.3.17", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }
#byte-slice-cast = { version = "1.2.0", default-features = false }
#heapless = "0.8.0"
#usbd-hid = "0.8.2"
#
#embedded-hal-1 = { package = "embedded-hal", version = "1.0.0" }
#embedded-hal-async = "1.0.0"
#embedded-io = { version = "0.6.1", features = [
##    "async",
##    "defmt"
#] }
#embedded-storage = { version = "0.3" }
#
#portable-atomic = { version = "1.5", features = ["critical-section"] }
#log = "0.4"
#pio-proc = "0.2"
#pio = "0.2.1"
#rand = { version = "0.8.5", default-features = false }


[profile.release]
debug = true

[[bin]]
test = false
name = "clock"
path = "src/main.rs"